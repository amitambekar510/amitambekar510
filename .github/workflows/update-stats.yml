name: Validate Profile

on:
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/update-stats.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/update-stats.yml'

# Badges refresh externally; this workflow does not generate statistics,
# commit README changes, or create failure-notification issues.
permissions:
  contents: read

jobs:
  validate:
    name: Validate README and banner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate profile assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          readme = Path("README.md").read_text(encoding="utf-8")
          banner = Path("assets/security-banner.svg")
          if not readme.strip():
              raise SystemExit("README.md is empty")
          if f'src="./{banner.as_posix()}"' not in readme:
              raise SystemExit("README.md must reference the security banner")
          root = ET.parse(banner).getroot()
          if root.tag != "{http://www.w3.org/2000/svg}svg":
              raise SystemExit("The banner must be a valid SVG document")
          if not root.findtext("{http://www.w3.org/2000/svg}title"):
              raise SystemExit("The banner needs an accessible title")
          print("README and SVG banner validation passed.")
          PY

      - name: Report failure
        if: failure()
        shell: bash
        run: |
          echo "::error::Profile validation failed. Review the failed step above."
          echo "Profile validation failed. Review the failed step in this run." >> "$GITHUB_STEP_SUMMARY"
