<svg width="1180" height="650" viewBox="0 0 1180 650" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="soctitle socdesc" font-family="JetBrains Mono, 'DejaVu Sans Mono', Consolas, monospace">
<title id="soctitle">Amit Ambekar — AI-Assisted SOC Terminal</title>
<desc id="socdesc">Animated cyber-terminal panel showing a rotating role title (SOC Analyst, Threat Intelligence Researcher, Detection Engineer, AI x Security Explorer), a glowing skill list, and quick links to GitHub, LinkedIn, and portfolio. Decorative hex-rain, scanline, and glow animations run continuously. On narrow displays the tooling and pinned-work detail simplify for legibility.</desc>
<style>
  @media (max-width: 560px) {
    .tooling-block, .pinned-block { display: none; }
  }
</style>
<defs>
  <clipPath id="canvasClip"><rect width="1180" height="650" rx="28"/></clipPath>
  <clipPath id="leftClip"><rect x="28" y="28" width="428" height="594" rx="20"/></clipPath>
  <clipPath id="rightClip"><rect x="474" y="28" width="678" height="594" rx="20"/></clipPath>

  <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#B45309"/>
    <stop offset="50%" stop-color="#0E7490"/>
    <stop offset="100%" stop-color="#047857"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0,0;0.3,0;0,0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#B45309" stop-opacity="0.9"/>
    <stop offset="35%" stop-color="#0E7490" stop-opacity="0.9"/>
    <stop offset="70%" stop-color="#047857" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#B45309" stop-opacity="0.9"/>
    <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#B45309" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#0E7490" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#0E7490" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#047857" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
  </radialGradient>

  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>

<g clip-path="url(#canvasClip)">
  <rect width="1180" height="650" fill="#F7FAFC"/>

  <circle cx="120" cy="90" r="220" fill="url(#glowPurple)">
    <animateTransform attributeName="transform" type="translate" values="0,0;40,30;0,0" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="520" r="260" fill="url(#glowCyan)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-30,-25;0,0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="80" r="180" fill="url(#glowEmerald)">
    <animateTransform attributeName="transform" type="translate" values="0,0;-20,25;0,0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <rect x="0" y="-40" width="1180" height="2.5" fill="url(#accentGrad)" opacity="0.18">
    <animate attributeName="y" values="-40;650" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- particles -->
  <g fill="#0E7490">
    <circle cx="150" cy="500" r="1.6" opacity="0.6"><animate attributeName="cy" values="500;60;500" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="560" r="1.3" opacity="0.5"><animate attributeName="cy" values="560;100;560" dur="17s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="540" r="1.5" opacity="0.5" fill="#B45309"><animate attributeName="cy" values="540;80;540" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="580" r="1.4" opacity="0.5" fill="#047857"><animate attributeName="cy" values="580;120;580" dur="19s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="19s" repeatCount="indefinite"/></circle>
  </g>

  <!-- outer shimmer border -->
  <rect x="2" y="2" width="1176" height="646" rx="26" fill="none" stroke="url(#borderGrad)" stroke-width="1.4"/>

  <!-- ================= LEFT PANEL ================= -->
  <rect x="28" y="28" width="428" height="594" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="rgba(15,23,42,.08)" stroke-width="1"/>
  <g clip-path="url(#leftClip)">
    <!-- matrix-style hex rain columns -->
    <g fill="#0E7490" font-size="11" opacity="0.30">
      <text x="55"  y="0">9F<tspan x="55" dy="18">4A</tspan><tspan x="55" dy="18">C1</tspan><tspan x="55" dy="18">7E</tspan><tspan x="55" dy="18">02</tspan><tspan x="55" dy="18">B3</tspan><tspan x="55" dy="18">88</tspan><tspan x="55" dy="18">D5</tspan><tspan x="55" dy="18">1F</tspan><tspan x="55" dy="18">A0</tspan><tspan x="55" dy="18">6C</tspan><tspan x="55" dy="18">33</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,640" dur="7s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="105" y="0">01<tspan x="105" dy="18">10</tspan><tspan x="105" dy="18">EE</tspan><tspan x="105" dy="18">4B</tspan><tspan x="105" dy="18">9A</tspan><tspan x="105" dy="18">2C</tspan><tspan x="105" dy="18">F1</tspan><tspan x="105" dy="18">77</tspan><tspan x="105" dy="18">05</tspan><tspan x="105" dy="18">C9</tspan><tspan x="105" dy="18">3E</tspan><tspan x="105" dy="18">8D</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,640" dur="9s" begin="1.4s" repeatCount="indefinite"/>
      </text>
      <text x="330" y="0">B7<tspan x="330" dy="18">2F</tspan><tspan x="330" dy="18">91</tspan><tspan x="330" dy="18">4D</tspan><tspan x="330" dy="18">AA</tspan><tspan x="330" dy="18">06</tspan><tspan x="330" dy="18">E3</tspan><tspan x="330" dy="18">5C</tspan><tspan x="330" dy="18">18</tspan><tspan x="330" dy="18">D2</tspan><tspan x="330" dy="18">7B</tspan><tspan x="330" dy="18">F4</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,640" dur="8s" begin="0.8s" repeatCount="indefinite"/>
      </text>
      <text x="385" y="0">3C<tspan x="385" dy="18">A9</tspan><tspan x="385" dy="18">50</tspan><tspan x="385" dy="18">DE</tspan><tspan x="385" dy="18">17</tspan><tspan x="385" dy="18">6F</tspan><tspan x="385" dy="18">C4</tspan><tspan x="385" dy="18">88</tspan><tspan x="385" dy="18">2B</tspan><tspan x="385" dy="18">91</tspan><tspan x="385" dy="18">0A</tspan><tspan x="385" dy="18">E5</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-140;0,640" dur="10s" begin="2.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- scan sweep inside left panel -->
    <rect x="28" y="-30" width="428" height="60" fill="url(#accentGrad)" opacity="0.06">
      <animate attributeName="y" values="-60;650" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- centre monogram frame -->
    <g transform="translate(242,319)">
      <animateTransform attributeName="transform" type="translate" values="242,319;242,311;242,319" dur="4.5s" repeatCount="indefinite" additive="sum"/>
      <path d="M -98 -98 L -98 -76 M -98 -98 L -76 -98" stroke="#0E7490" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 98 -98 L 98 -76 M 98 -98 L 76 -98" stroke="#0E7490" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M -98 98 L -98 76 M -98 98 L -76 98" stroke="#0E7490" stroke-width="2" fill="none" opacity="0.7"/>
      <path d="M 98 98 L 98 76 M 98 98 L 76 98" stroke="#0E7490" stroke-width="2" fill="none" opacity="0.7"/>
      <circle r="88" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" opacity="0.5"/>
      <text x="0" y="18" text-anchor="middle" font-size="64" font-weight="700" fill="url(#accentGrad)" filter="url(#strongGlow)">AA</text>
    </g>
    <rect x="286" y="375" width="3" height="26" fill="#0E7490" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.45;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <text x="242" y="439" text-anchor="middle" font-size="13" letter-spacing="3" fill="#475569">SECURITY OPERATIONS</text>
    <text x="242" y="463" text-anchor="middle" font-size="13" letter-spacing="3" fill="#475569">CENTER · ANALYST</text>

    <rect x="150" y="487" width="184" height="1" fill="url(#accentGrad)" opacity="0.5"/>
    <text x="242" y="513" text-anchor="middle" font-size="12" fill="#B45309">$ status --uptime</text>
    <text x="242" y="533" text-anchor="middle" font-size="12" fill="#047857">defensive posture: active_</text>
  </g>
  <rect x="28" y="28" width="428" height="594" rx="20" fill="none" stroke="rgba(15,23,42,.06)" stroke-width="1"/>

  <!-- ================= RIGHT PANEL ================= -->
  <rect x="474" y="28" width="678" height="594" rx="20" fill="#FFFFFF" fill-opacity="0.55" stroke="rgba(15,23,42,.08)" stroke-width="1"/>
  <g clip-path="url(#rightClip)">
    <!-- terminal chrome -->
    <rect x="474" y="28" width="678" height="34" rx="20" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="474" y="46" width="678" height="16" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="500" cy="45" r="5.5" fill="#F87171"/>
    <circle cx="519" cy="45" r="5.5" fill="#FBBF24"/>
    <circle cx="538" cy="45" r="5.5" fill="#34D399"/>
    <text x="813" y="49" text-anchor="middle" font-size="11" fill="#475569">amit@soc-terminal ~ zsh</text>
    <line x1="474" y1="62" x2="1152" y2="62" stroke="rgba(15,23,42,.08)" stroke-width="1"/>

    <text x="502" y="106" font-size="21" fill="#0b0f14">Hi <tspan font-size="21">👋</tspan></text>
    <text x="502" y="146" font-size="30" font-weight="700" fill="url(#accentGrad)" filter="url(#softGlow)">I'm Amit Ambekar</text>

    <!-- typing role cycle -->
    <g font-size="18" fill="#475569">
      <text x="502" y="180" opacity="1">&gt; SOC Analyst<tspan fill="#0E7490">▌</tspan>
        <animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="502" y="180" opacity="0">&gt; Threat Intelligence Researcher<tspan fill="#0E7490">▌</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="502" y="180" opacity="0">&gt; Detection Engineer<tspan fill="#0E7490">▌</tspan>
        <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="502" y="180" opacity="0">&gt; AI x Security Explorer<tspan fill="#0E7490">▌</tspan>
        <animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.24;0.25;0.49;0.5;0.74;0.75;1" dur="16s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- sequential meta reveal -->
    <g font-size="14" fill="#0b0f14">
      <text x="502" y="222" opacity="0">🎯 Focus: AI-assisted SOC operations &amp; threat-intel automation
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" begin="0.4s" fill="freeze"/>
      </text>
      <text x="502" y="248" opacity="0">🌐 Portfolio: portfolio.thesafehouse.in
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" begin="1.0s" fill="freeze"/>
      </text>
      <text x="502" y="274" opacity="0">🔗 github.com/amitambekar510
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" begin="1.6s" fill="freeze"/>
      </text>
    </g>

    <line x1="502" y1="296" x2="1124" y2="296" stroke="rgba(15,23,42,.08)" stroke-width="1"/>

    <!-- skill pills : cybersecurity stack, grounded in real subject matter -->
    <g class="tooling-block" font-size="13" fill="#0b0f14">
      <text x="502" y="322" font-size="13" letter-spacing="2" fill="#475569">TOOLING &amp; STACK</text>
      <!-- row 1 : AI + EDR -->
      <g><rect x="502" y="336" width="132" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="568" y="355" text-anchor="middle">AI-Based SIEM</text></g>
      <g><rect x="644" y="336" width="152" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="720" y="355" text-anchor="middle">CrowdStrike EDR</text></g>
      <g><rect x="806" y="336" width="156" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="884" y="355" text-anchor="middle">SentinelOne EDR</text></g>

      <!-- row 2 -->
      <g><rect x="502" y="374" width="88" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="546" y="393" text-anchor="middle">Elastic</text></g>
      <g><rect x="600" y="374" width="72" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="636" y="393" text-anchor="middle">MISP</text></g>
      <g><rect x="682" y="374" width="84" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="724" y="393" text-anchor="middle">Nessus</text></g>

      <!-- row 3 -->
      <g><rect x="502" y="412" width="94" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="549" y="431" text-anchor="middle">FortiGate</text></g>
      <g><rect x="606" y="412" width="140" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="676" y="431" text-anchor="middle">MITRE ATT&amp;CK</text></g>
      <g><rect x="756" y="412" width="116" height="28" rx="14" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1" filter="url(#softGlow)"/><text x="814" y="431" text-anchor="middle">Threat Intel</text></g>

      <g opacity="0.9">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.4s" begin="2.0s" fill="freeze"/>
      </g>
    </g>

    <line x1="502" y1="462" x2="1124" y2="462" stroke="rgba(15,23,42,.08)" stroke-width="1"/>

    <!-- pinned repo highlight -->
    <g class="pinned-block">
      <text x="502" y="488" font-size="13" letter-spacing="2" fill="#475569">PINNED WORK</text>
      <text x="502" y="512" font-size="13" fill="#0b0f14">📌 Malicious-Domain-Threat-List <tspan fill="#475569">— multi-source IOC feed for SOC/SIEM/firewall</tspan></text>
      <text x="502" y="534" font-size="13" fill="#0b0f14">📌 SOC-DarkWatch <tspan fill="#475569">— dark-web monitoring: SpiderFoot · TorBot · MISP · ELK</tspan></text>
    </g>

    <line x1="502" y1="554" x2="1124" y2="554" stroke="rgba(15,23,42,.08)" stroke-width="1"/>

    <!-- socials -->
    <g font-size="13" font-weight="600">
      <a xlink:href="https://github.com/amitambekar510" target="_blank">
        <rect x="502" y="574" width="98" height="32" rx="16" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#softGlow)"/>
        <text x="551" y="595" text-anchor="middle" fill="#0b0f14">GitHub</text>
      </a>
      <a xlink:href="https://www.linkedin.com/in/amitmilindambekar/" target="_blank">
        <rect x="612" y="574" width="106" height="32" rx="16" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#softGlow)"/>
        <text x="665" y="595" text-anchor="middle" fill="#0b0f14">LinkedIn</text>
      </a>
      <a xlink:href="https://portfolio.thesafehouse.in" target="_blank">
        <rect x="730" y="574" width="122" height="32" rx="16" fill="#FFFFFF" stroke="url(#accentGrad)" stroke-width="1.2" filter="url(#softGlow)"/>
        <text x="791" y="595" text-anchor="middle" fill="#0b0f14">Portfolio</text>
