<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Amit Ambekar — Cybersecurity Engineer</title>
<desc id="desc">Threat intelligence, detection engineering and SOC automation. Dark charcoal banner with amber and cyan accents with a shield and connected signal nodes. The radar ring rotates slowly and sends out a gentle pulse; reduced-motion preferences disable animation.</desc>
<style>
.radar-orbit { transform-origin: 0px 0px; animation: orbit 18s linear infinite; }
.radar-pulse { transform-origin: 0px 0px; animation: pulse 5s ease-out infinite; }
@keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pulse { 0% { transform: scale(.78); opacity: 0; } 20% { opacity: .45; } 100% { transform: scale(1.18); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .radar-orbit, .radar-pulse { animation: none; } .radar-pulse { display: none; } }
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#121924"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#274352" stroke-width=".6"/></pattern></defs>
<rect width="1200" height="380" rx="24" fill="url(#bg)"/><rect width="1200" height="380" rx="24" fill="url(#grid)" opacity=".55"/>
<rect x="48" y="49" width="5" height="25" rx="2" fill="#35d0e0"/>
<g font-family="Inter,Segoe UI,Arial,DejaVu Sans,sans-serif">
<text x="68" y="68" font-family="JetBrains Mono,DejaVu Sans Mono,Consolas,monospace" font-size="16" letter-spacing="1.5" fill="#ffb020">THE SAFEHOUSE / SECURITY OPERATIONS</text>
<text x="48" y="148" font-family="JetBrains Mono,DejaVu Sans Mono,Consolas,monospace" font-size="58" font-weight="bold" fill="#e7eef4">Amit Ambekar</text>
<text x="51" y="191" font-size="25" fill="#e7eef4">Cybersecurity Engineer</text>
<text x="51" y="245" font-size="19" fill="#b5c2cf">Turning threat intelligence into actionable defense.</text>
<rect x="48" y="291" width="193" height="37" rx="5" fill="#10252c" stroke="#1d6b73"/><text x="66" y="315" font-size="14" fill="#35d0e0">THREAT INTELLIGENCE</text>
<rect x="253" y="291" width="177" height="37" rx="5" fill="#2b2314" stroke="#8a621c"/><text x="274" y="315" font-size="14" fill="#ffb020">DETECTION / ELK</text>
<rect x="442" y="291" width="179" height="37" rx="5" fill="#10252c" stroke="#1d6b73"/><text x="460" y="315" font-size="14" fill="#35d0e0">SOC AUTOMATION</text>
</g>
