<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="t d">
<title id="t">The Safehouse Academy — coming soon</title>
<desc id="d">The Safehouse Academy is launching soon with the Cyber Security and Audit Ready Course, built around what the market needs today.</desc>
<style>
.soon{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
.ring{transform-origin:1030px 120px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.soon,.ring{animation:none}}
</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0f14"/><stop offset="1" stop-color="#121924"/></linearGradient>
