<rect width="1200" height="240" rx="24" fill="url(#bg)"/><rect width="1200" height="240" rx="24" fill="url(#grid)" opacity=".5"/>
<rect x="1" y="1" width="1198" height="238" rx="23" fill="none" stroke="#8a621c" stroke-width="1.5"/>
